name: Rust Game CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks-and-captures:
    name: Check, test, capture, and build WebGL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nanite_swarm
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
        with:
          path: nanite_swarm
      - name: Checkout macroquad-toolkit
        uses: actions/checkout@v4
        with:
          repository: Kalaith/macroquad-toolkit
          path: macroquad-toolkit
      - name: Install Linux build and capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libx11-dev libxi-dev libgl1-mesa-dev xvfb
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --manifest-path Cargo.toml -- --check
      - name: Run Clippy
        run: cargo clippy --manifest-path Cargo.toml --all-targets --all-features -- -D warnings
      - name: Run tests and performance fixtures
        run: cargo test --manifest-path Cargo.toml --all-features
      - name: Capture required headless scenes
        run: |
          manifest="$RUNNER_TEMP/nanite_swarm_captures.tsv"
          printf 'mainmenu\t%s/mainmenu.png\nresearch\t%s/research.png\nlogistics\t%s/logistics.png\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" > "$manifest"
          NANITE_SWARM_CAPTURE_MANIFEST="$manifest" NANITE_SWARM_HEADLESS=1 xvfb-run -a cargo run --manifest-path Cargo.toml --release
          test -s "$RUNNER_TEMP/mainmenu.png"
          test -s "$RUNNER_TEMP/research.png"
          test -s "$RUNNER_TEMP/logistics.png"
      - name: Build WebGL release
        run: cargo build --manifest-path Cargo.toml --release --target wasm32-unknown-unknown
        env:
          RUSTFLAGS: "-C link-arg=--allow-undefined"

  windows-build:
    name: Build Windows release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: nanite_swarm
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
        with:
          path: nanite_swarm
      - name: Checkout macroquad-toolkit
        uses: actions/checkout@v4
        with:
          repository: Kalaith/macroquad-toolkit
          path: macroquad-toolkit
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Windows release
        run: cargo build --manifest-path Cargo.toml --release
